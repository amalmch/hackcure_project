version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: hackcure_user
      POSTGRES_PASSWORD: hackcure_password
      POSTGRES_DB: hackcure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://hackcure_user:hackcure_password@db:5432/hackcure_db
      SECRET_KEY: test_secret_key_change_in_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
