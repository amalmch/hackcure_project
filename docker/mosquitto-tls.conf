# Mosquitto avec TLS (V3) - exemple. Remplacer docker/mosquitto.conf par ce fichier dans docker-compose.yml,
# monter le dossier des certificats sur /mosquitto/certs et publier le port 8883 :
#   volumes: [ "./docker/mosquitto-tls.conf:/mosquitto/config/mosquitto.conf:ro", "./dashboard/certs:/mosquitto/certs:ro" ]
#   ports:   [ "8883:8883" ]
# Certificat de demonstration : scripts/make-cert (--host <adresse du serveur>).
# Cote plateforme : MQTT_TLS=1, MQTT_PORT=8883, MQTT_CA_FILE=dashboard/certs/server.crt
# Cote Raspberry Pi : mqtt.tls: true, mqtt.port: 8883, mqtt.ca_file dans edge/config/room101.yaml
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.3
allow_anonymous true

# ecoute locale en clair, reservee aux conteneurs du meme reseau Docker
listener 1883
persistence false
log_dest stdout
